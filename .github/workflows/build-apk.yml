name: Build & Deploy APK on Mobile App Changes

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile-app/**'   # Only triggers when mobile app code changes

jobs:
  build-and-deploy-apk:
    name: EAS Build → Download APK → Push to Web
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Needed to commit the APK back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK locally on Github Runner
        working-directory: apps/mobile-app
        run: |
          eas build --platform android --profile preview --local --non-interactive --output ../web-manager-dashboard/public/dalupotha.apk
          ls -lh ../web-manager-dashboard/public/dalupotha.apk

      - name: Commit & push APK + version.json to repository
        run: |
          # Get version from app.json
          APP_VERSION=$(node -p "require('./apps/mobile-app/app.json').expo.version")
          # Update version.json
          cat > apps/web-manager-dashboard/public/version.json <<EOF
          {
            "version": "${APP_VERSION}",
            "versionCode": $(date +%s),
            "downloadUrl": "http://188.166.231.80/dalupotha.apk",
            "releaseNotes": "Bug fixes and improvements — v${APP_VERSION}"
          }
          EOF
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add apps/web-manager-dashboard/public/dalupotha.apk apps/web-manager-dashboard/public/version.json
          git diff --staged --quiet || git commit -m "chore: auto-update APK v${APP_VERSION}"
          git push
