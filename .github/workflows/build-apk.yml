name: Build & Deploy APK on Mobile App Changes

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile-app/**'   # Only triggers when mobile app code changes

jobs:
  build-and-deploy-apk:
    name: EAS Build → Download APK → Push to Web
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Needed to commit the APK back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: apps/mobile-app
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        working-directory: apps/mobile-app
        id: eas_build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>/dev/null || eas build --platform android --profile preview --non-interactive)
          BUILD_URL=$(echo "$BUILD_OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['artifacts']['buildUrl'])" 2>/dev/null || echo "")
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $BUILD_URL"

      - name: Download built APK
        if: steps.eas_build.outputs.build_url != ''
        run: |
          curl -L "${{ steps.eas_build.outputs.build_url }}" -o apps/web-manager-dashboard/public/dalupotha.apk
          ls -lh apps/web-manager-dashboard/public/dalupotha.apk

      - name: Commit & push APK to repository
        if: steps.eas_build.outputs.build_url != ''
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add apps/web-manager-dashboard/public/dalupotha.apk
          git diff --staged --quiet || git commit -m "chore: auto-update APK from EAS build [skip ci]"
          git push
