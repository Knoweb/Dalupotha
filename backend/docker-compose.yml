services:
  postgres:
    image: postgres:16
    container_name: dalupotha-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dalupotha}
      POSTGRES_USER: ${POSTGRES_USER:-dalupotha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
    volumes:
      - dalupotha_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dalupotha_user} -d ${POSTGRES_DB:-dalupotha}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: dalupotha-db-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "" # Leave empty to back up ALL databases automatically
      POSTGRES_USER: ${POSTGRES_USER:-dalupotha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
      POSTGRES_PORT: 5432
      BACKUP_NUM_KEEP: 30
      BACKUP_FREQUENCY: 1d
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dalupotha-redis
    ports:
      - "6379:6379"
    volumes:
      - dalupotha_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./services/api-gateway
    container_name: dalupotha-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
    develop:
      watch:
        - path: ./services/api-gateway/src
          action: rebuild
        - path: ./services/api-gateway/pom.xml
          action: rebuild
        - path: ./services/api-gateway/Dockerfile
          action: rebuild

  auth-service:
    build: ./services/auth-service
    container_name: dalupotha-auth-service
    ports:
      - "18081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
      JWT_SECRET: ${JWT_SECRET:-dalupotha-secret}
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      VONAGE_SENDER_ID: ${VONAGE_SENDER_ID:-VonageAPIs}
      DEV_MODE: ${DEV_MODE:-false}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_SENDER: ${INFOBIP_SENDER:-Dalupotha}
    develop:
      watch:
        - path: ./services/auth-service/src
          action: rebuild
        - path: ./services/auth-service/pom.xml
          action: rebuild
        - path: ./services/auth-service/Dockerfile
          action: rebuild

  collection-service:
    build: ./services/collection-service
    container_name: dalupotha-collection-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collection_db
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_REALTIME_CHANNEL: ${SUPABASE_REALTIME_CHANNEL}
    develop:
      watch:
        - path: ./services/collection-service/src
          action: rebuild
        - path: ./services/collection-service/pom.xml
          action: rebuild
        - path: ./services/collection-service/Dockerfile
          action: rebuild

  finance-service:
    build: ./services/finance-service
    container_name: dalupotha-finance-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - auth-service
      - notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dalupotha}
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
      AUTH_SERVICE_URL: http://auth-service:8081
      COLLECTION_SERVICE_URL: http://collection-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    develop:
      watch:
        - path: ./services/finance-service/src
          action: rebuild
        - path: ./services/finance-service/pom.xml
          action: rebuild
        - path: ./services/finance-service/Dockerfile
          action: rebuild

  inventory-service:
    build: ./services/inventory-service
    container_name: dalupotha-inventory-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dalupotha}
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
    develop:
      watch:
        - path: ./services/inventory-service/src
          action: rebuild
        - path: ./services/inventory-service/pom.xml
          action: rebuild
        - path: ./services/inventory-service/Dockerfile
          action: rebuild

  notification-service:
    build: ./services/notification-service
    container_name: dalupotha-notification-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dalupotha}
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
    develop:
      watch:
        - path: ./services/notification-service/src
          action: rebuild
        - path: ./services/notification-service/pom.xml
          action: rebuild
        - path: ./services/notification-service/Dockerfile
          action: rebuild

  staffing-service:
    build: ./services/staffing-service
    container_name: dalupotha-staffing-service
    ports:
      - "8086:8086"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dalupotha}
      DB_USER: ${POSTGRES_USER:-dalupotha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dalupotha_password}
    develop:
      watch:
        - path: ./services/staffing-service/src
          action: rebuild
        - path: ./services/staffing-service/pom.xml
          action: rebuild
        - path: ./services/staffing-service/Dockerfile
          action: rebuild

volumes:
  dalupotha_postgres_data:
  dalupotha_redis_data:
