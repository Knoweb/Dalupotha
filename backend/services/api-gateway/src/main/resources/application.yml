spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: auth-service-routes
          uri: http://auth-service:8081
          predicates:
            - Path=/auth, /auth/**
          filters:
            - RewritePath=/auth(?<segment>.*), /api/auth$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - id: collection-service-routes
          uri: http://collection-service:8082
          predicates:
            - Path=/collection, /collection/**
          filters:
            - RewritePath=/collection(?<segment>.*), /api/collection$\{segment}
        - id: finance-service-routes
          uri: http://finance-service:8083
          predicates:
            - Path=/finance, /finance/**
          filters:
            - RewritePath=/finance(?<segment>.*), /api/finance$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - id: services-routes
          uri: http://finance-service:8083
          predicates:
            - Path=/services, /services/**
          filters:
            - RewritePath=/services(?<segment>.*), /api/services$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - id: notification-ws-routes
          uri: http://notification-service:8085
          predicates:
            - Path=/notifications/ws/**
          filters:
            - RewritePath=/notifications/(?<segment>.*), /${segment}
        - id: notification-routes
          uri: http://notification-service:8085
          predicates:
            - Path=/notifications, /notifications/**
          filters:
            - RewritePath=/notifications(?<segment>.*), /api/notifications$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - id: inventory-service-routes
          uri: http://inventory-service:8084
          predicates:
            - Path=/inventory, /inventory/**
          filters:
            - RewritePath=/inventory(?<segment>.*), /api/inventory$\{segment}
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

server:
  port: 8080

dalupotha:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    collection-url: ${COLLECTION_SERVICE_URL:http://collection-service:8082}
    finance-url: ${FINANCE_SERVICE_URL:http://finance-service:8083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8084}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
    staffing-url: ${STAFFING_SERVICE_URL:http://staffing-service:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
