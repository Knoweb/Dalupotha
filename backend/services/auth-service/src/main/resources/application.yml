spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dalupotha}
    username: ${DB_USER:dalupotha_user}
    password: ${DB_PASSWORD:dalupotha_password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

app:
  dev-mode: ${DEV_MODE:false}

firebase:
  api-key: ${FIREBASE_API_KEY:}

infobip:
  api-key: ${INFOBIP_API_KEY:}
  base-url: ${INFOBIP_BASE_URL:}
  sender: ${INFOBIP_SENDER:Dalupotha}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT
jwt:
  secret: ${JWT_SECRET:dalupotha-super-secret-jwt-key-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Vonage SMS
vonage:
  api:
    key: ${VONAGE_API_KEY:dummy-key}
    secret: ${VONAGE_API_SECRET:dummy-secret}
  sender-id: ${VONAGE_SENDER_ID:VonageAPIs}

# Twilio SMS (Fallback to avoid BeanCreationException)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:dummy-sid}
  auth-token: ${TWILIO_AUTH_TOKEN:dummy-token}
  phone-number: ${TWILIO_PHONE_NUMBER:dummy-number}
